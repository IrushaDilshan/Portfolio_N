<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Mockup</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Gradient Background */
            background: radial-gradient(circle at top right, #381D6D, #050614);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            display: flex;
            align-items: center;
            /* Create a slight 3D perspective */
            transform: perspective(1500px) rotateY(-5deg) rotateX(2deg);
        }

        /* --- LAPTOP STYLE --- */
        .laptop {
            position: relative;
            width: 900px;
            height: 560px;
            background: #111;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 
                0 0 0 2px #222,
                20px 30px 50px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .laptop-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .laptop-screen img {
            width: 100%;
            height: auto;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        /* Laptop Base hint */
        .laptop::after {
             content: '';
             position: absolute;
             bottom: -22px;
             left: -20px;
             right: -20px;
             height: 25px;
             background: #1a1a1a;
             border-radius: 0 0 20px 20px;
             transform: perspective(1000px) rotateX(10deg);
             box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }


        /* --- PHONE STYLE --- */
        .phone {
            position: absolute;
            right: -100px;
            bottom: -40px;
            width: 250px;
            height: 520px;
            background: #000;
            border: 10px solid #1f1f1f;
            border-radius: 40px;
            z-index: 2;
            box-shadow: 
                0 0 0 2px #333,
                15px 25px 40px rgba(0,0,0,0.7);
            transform: rotateY(5deg) translateZ(50px);
            overflow: hidden;
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
        }
        
        .phone-screen img {
            width: 100%;
            height: auto;
            position: absolute;
            top: 0; 
            left: 0;
        }
        
        /* Phone Notch */
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 25px;
            background: #1f1f1f;
            border-radius: 0 0 15px 15px;
            z-index: 3;
        }
        
        /* Decor: Code Symbols in BG */
        .decor {
            position: absolute;
            color: rgba(255, 255, 255, 0.03);
            font-size: 300px;
            font-weight: bold;
            font-family: monospace;
            z-index: 0;
            pointer-events: none;
        }
        .decor-1 { top: -100px; left: -100px; transform: rotate(-15deg); }
        .decor-2 { bottom: -100px; right: -50px; transform: rotate(10deg); }

        /* Title text */
        .title-overlay {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }
        h1 {
            color: #fff;
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-top: 10px;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <div class="decor decor-1">&lt;/&gt;</div>
    <div class="decor decor-2">{}</div>

    <div class="title-overlay">
        <h1>New Portfolio Live</h1>
        <p>Full-Stack Developer • React + Tailwind</p>
    </div>

    <div class="container">
        <div class="laptop">
            <div class="laptop-screen">
                <img src="desktop_shot.png" alt="Desktop View">
            </div>
        </div>

        <div class="phone">
            <div class="phone-notch"></div>
            <div class="phone-screen">
                <img src="mobile_shot.png" alt="Mobile View">
            </div>
        </div>
    </div>

</body>
</html>
